blueprint:
  name: Tide extreme alert (crosses threshold)
  description: |
    Fires once a day at a chosen local time and notifies you when the
    **first** upcoming high or low tide within a lookahead window that
    matches your criteria (threshold, direction, optional daylight) is
    coming up.

    Great for planning ahead — *"notify me at noon the day prior about
    tomorrow morning's ultra-low tide"* so you can pack for a tidepool
    trip. Skips over non-matching tides — if today's low is above your
    threshold but tomorrow's is below, the notification still fires.
  domain: automation
  source_url: https://raw.githubusercontent.com/mullender/ha-tides/main/blueprints/automation/ha_tides_plus/tide_extreme_alert.yaml
  input:
    station:
      name: Tide station
      description: |
        The Tides Plus station device.

        The blueprint reads the `Tide height (estimated)` sensor on this
        device and iterates its `extrema` attribute to find the first
        matching upcoming tide.
      selector:
        device:
          filter:
            - integration: ha_tides_plus
    threshold_direction:
      name: Direction
      description: |
        - **Below** — match a *low* tide at or below the threshold (typical tidepool case).
        - **Above** — match a *high* tide at or above the threshold (dock height, king-high, storm surge).
      default: below
      selector:
        select:
          options:
            - value: below
              label: Match a LOW tide at or below the threshold
            - value: above
              label: Match a HIGH tide at or above the threshold
    threshold:
      name: Height threshold
      description: |
        Value is in the same unit as the Tides Plus sensor — `ft` on a
        US-defaults HA install, `m` on a metric one.

        Check any tide sensor's current display to confirm your unit.
      default: 1.0
      selector:
        number:
          min: -10
          max: 30
          step: 0.1
          mode: box
    notify_at:
      name: Notify at (local time of day)
      description: |
        The blueprint runs once each day at this time. Pick the lead
        time that suits you:

        - **12:00** — noon the day before
        - **20:00** — the evening before
        - **06:00** — same-day early warning
      default: "12:00:00"
      selector:
        time: {}
    lookahead_hours:
      name: Lookahead
      description: |
        How far into the future to look for a matching tide when the
        blueprint runs.

        - **24–30 h** — some time before tomorrow noon (if firing at noon)
        - **48 h** — the next full high/low cycle
        - **168 h** — a whole week; catches the next matching tide even if today's cycle is quiet
      default: 30
      selector:
        number:
          min: 1
          max: 168
          step: 1
          mode: slider
          unit_of_measurement: hr
    require_daylight:
      name: Only match tides that happen in daylight
      description: |
        Uses `sun.sun`'s `next_rising` / `next_setting`, projecting the
        local time-of-day onto each candidate's date.

        Accurate to a few minutes at ±1 day — sunrise drifts ≈ 1 min/day.
      default: true
      selector:
        boolean: {}
    sun_entity:
      name: Sun entity
      default: sun.sun
      selector:
        entity:
          filter:
            domain: sun
    notify_service:
      name: Notification service
      description: |
        Notify service to call. Examples:

        - `notify.persistent_notification` — HA sidebar notification (default)
        - `notify.mobile_app_YOUR_PHONE` — Companion app push
        - `notify.notify` — the default group
      default: notify.persistent_notification
      selector:
        text: {}
    notification_title:
      name: Notification title
      description: |
        Template-friendly. Available placeholders:

        - `{{ station_name }}` — e.g. *"9445882: Eagle Harbor, WA"*
        - `{{ event_height }}` — the matched tide's height (rounded)
        - `{{ event_unit }}` — `ft` or `m`
        - `{{ event_type }}` — `H` or `L`
        - `{{ event_time_local }}` — a datetime (use `.strftime('%-I:%M %p')`)
        - `{{ when_day }}` — `today` / `tomorrow` / weekday name
      default: "Tide alert for {{ station_name }}"
      selector:
        text: {}
    notification_message:
      name: Notification message
      description: |
        Template-friendly. Same placeholders as the title.
      default: >-
        Tide reaching {{ event_height }} {{ event_unit }}
        at {{ event_time_local.strftime('%-I:%M %p') }} {{ when_day }}.
      selector:
        text:
          multiline: true
    notification_data:
      name: Notification data (advanced)
      description: |
        Extra key/value data merged into the notify service's `data:` field.

        By default `url` points to this station's device page so tapping
        the notification opens it in the Companion app. Add your own
        keys, or override `url`.

        Common overrides:

        - `url:` — deep-link path (relative, e.g. `/lovelace/tides`)
        - `push:` — iOS sound / interruption-level / critical
        - `channel:` — Android notification channel
        - `actions:` — clickable action buttons
        - `image:` — inline preview image URL

        See the HA Companion app docs for the full list.
      default: {}
      selector:
        object: {}

mode: single
max_exceeded: silent

variables:
  station_device: !input station
  thr_dir: !input threshold_direction
  thr: !input threshold
  lookahead_h: !input lookahead_hours
  require_daylight: !input require_daylight
  sun_entity: !input sun_entity
  notification_data: !input notification_data
  # Infer the estimated-height sensor from the station device.
  height_entity: >-
    {% set ents = device_entities(station_device) %}
    {{ ents | select('search', '_tide_height_estimated$') | list | first | default('') }}
  # Match target: 'H' for above, 'L' for below.
  target_type: "{{ 'L' if thr_dir == 'below' else 'H' }}"
  # Sun projection — one sunrise / sunset time-of-day for the current
  # location (drifts a minute a day; close enough for daylight gating).
  sunrise_min: >-
    {% set sr = as_datetime(state_attr(sun_entity, 'next_rising')) %}
    {% if sr is none %}0
    {% else %}
      {% set l = sr.astimezone() %}{{ l.hour * 60 + l.minute }}
    {% endif %}
  sunset_min: >-
    {% set ss = as_datetime(state_attr(sun_entity, 'next_setting')) %}
    {% if ss is none %}1440
    {% else %}
      {% set l = ss.astimezone() %}{{ l.hour * 60 + l.minute }}
    {% endif %}
  # First knot within [now, now + lookahead) that matches type + threshold
  # + (optional) daytime window.
  matched_knot: >-
    {% set extrema = state_attr(height_entity, 'extrema') or [] %}
    {% set thr_num = thr | float %}
    {% set now_ts = now().timestamp() %}
    {% set horizon = now_ts + (lookahead_h | int) * 3600 %}
    {% set ns = namespace(match=none) %}
    {% for k in extrema %}
      {% if ns.match is none and k.type == target_type %}
        {% set t = as_datetime(k.time) %}
        {% set t_ts = t.timestamp() %}
        {% if t_ts > now_ts and t_ts < horizon %}
          {% set meets = (k.height <= thr_num) if thr_dir == 'below' else (k.height >= thr_num) %}
          {% if meets %}
            {% if not require_daylight %}
              {% set ns.match = k %}
            {% else %}
              {% set l = t.astimezone() %}
              {% set ev_min = l.hour * 60 + l.minute %}
              {% if (sunrise_min | int) <= ev_min <= (sunset_min | int) %}
                {% set ns.match = k %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.match }}
  # Convenience placeholders for the notification templates.
  station_name: "{{ device_attr(station_device, 'name') or 'tide station' }}"
  event_time_local: >-
    {{ as_datetime(matched_knot.time).astimezone() if matched_knot else none }}
  event_height: "{{ matched_knot.height if matched_knot else '' }}"
  event_unit: "{{ state_attr(height_entity, 'unit') or state_attr(height_entity, 'unit_of_measurement') or '' }}"
  event_type: "{{ matched_knot.type if matched_knot else '' }}"
  when_day: >-
    {% set ev = event_time_local %}
    {% if ev is none %}soon
    {% else %}
      {% set diff = (ev.date() - now().date()).days %}
      {% if diff == 0 %}today
      {% elif diff == 1 %}tomorrow
      {% else %}{{ ev.strftime('%A %b %-d') }}
      {% endif %}
    {% endif %}

trigger:
  - platform: time
    at: !input notify_at

condition:
  - condition: template
    value_template: "{{ matched_knot is not none }}"

action:
  - variables:
      _default_data:
        url: "/config/devices/device/{{ station_device }}"
      merged_data: "{{ _default_data | combine(notification_data or {}) }}"
  - service: !input notify_service
    data:
      title: !input notification_title
      message: !input notification_message
      data: "{{ merged_data }}"
