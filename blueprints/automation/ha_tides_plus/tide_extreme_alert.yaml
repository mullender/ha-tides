blueprint:
  name: Tide extreme alert (crosses threshold)
  description: >
    Fires at a chosen time each day and notifies you when the next high or
    low tide within a lookahead window crosses a threshold height. Great
    for planning ahead — e.g. "notify me at noon the day prior about
    tomorrow morning's ultra-low tide" so you can pack for a tidepool
    trip. Optional daytime-window filter so overnight lows don't ping you.
  domain: automation
  source_url: https://raw.githubusercontent.com/mullender/ha-tides/main/blueprints/automation/ha_tides_plus/tide_extreme_alert.yaml
  input:
    tide_time_sensor:
      name: Tide time sensor
      description: >
        The Tides Plus timestamp sensor to watch — pick either
        sensor.<station>_next_low_tide or sensor.<station>_next_high_tide.
      selector:
        entity:
          filter:
            - integration: ha_tides_plus
              domain: sensor
    tide_height_sensor:
      name: Corresponding height sensor
      description: >
        The paired height sensor —
        sensor.<station>_next_low_tide_height or
        sensor.<station>_next_high_tide_height, matching your choice above.
      selector:
        entity:
          filter:
            - integration: ha_tides_plus
              domain: sensor
    threshold:
      name: Height threshold
      description: >
        Notify when the coming extreme's height crosses this value, in the
        height sensor's unit (ft or m). For a "falling below X" alert
        (typical tidepool case) pair with the next_low_tide sensor and
        pick "below". For a "rising above X" alert (dock height, storm
        surge) pair with next_high_tide and pick "above".
      default: 1.0
      selector:
        number:
          min: -10
          max: 30
          step: 0.1
          mode: box
    threshold_direction:
      name: Threshold direction
      default: below
      selector:
        select:
          options:
            - value: below
              label: Height at or below threshold (use with next_low_tide)
            - value: above
              label: Height at or above threshold (use with next_high_tide)
    notify_at:
      name: Notify at (local time of day)
      description: >
        The blueprint runs once each day at this time. Pick something that
        gives you the lead time you want — noon the day prior, 8 PM the
        night before, 6 AM same-day, etc.
      default: "12:00:00"
      selector:
        time: {}
    lookahead_hours:
      name: Lookahead
      description: >
        How far into the future to look for a matching tide when the
        blueprint runs. 30 h covers "some time before tomorrow noon" when
        firing at noon; 48 h covers the next two-tide cycle comfortably.
      default: 30
      selector:
        number:
          min: 1
          max: 96
          step: 1
          mode: slider
          unit_of_measurement: hr
    require_daytime_event:
      name: Only notify if the event is in the daytime window
      default: true
      selector:
        boolean: {}
    daytime_start:
      name: Daytime window — start (local time of day)
      description: Earliest event time (local) that counts as "daytime".
      default: "07:00:00"
      selector:
        time: {}
    daytime_end:
      name: Daytime window — end (local time of day)
      description: Latest event time (local) that counts as "daytime".
      default: "19:00:00"
      selector:
        time: {}
    notify_service:
      name: Notification service
      description: >
        Notify service to call, for example
        notify.mobile_app_your_phone,
        notify.notify,
        notify.persistent_notification.
      default: notify.persistent_notification
      selector:
        text: {}
    notification_title:
      name: Notification title
      default: Tide alert
      selector:
        text: {}

mode: single
max_exceeded: silent

variables:
  time_entity: !input tide_time_sensor
  height_entity: !input tide_height_sensor
  thr: !input threshold
  thr_dir: !input threshold_direction
  lookahead_h: !input lookahead_hours
  require_daytime: !input require_daytime_event
  daytime_start: !input daytime_start
  daytime_end: !input daytime_end

trigger:
  - platform: time
    at: !input notify_at

condition:
  - condition: template
    value_template: >-
      {% set ts = states(time_entity) %}
      {% if ts in ('unknown', 'unavailable', 'none', '', None) %}
        false
      {% else %}
        {% set t = as_datetime(ts) %}
        {% set future = t > now() %}
        {% set within = (t - now()).total_seconds() < (lookahead_h | int) * 3600 %}
        {% set h = states(height_entity) | float(0) %}
        {% set meets = (h <= (thr | float)) if thr_dir == 'below' else (h >= (thr | float)) %}
        {% if not (future and within and meets) %}
          false
        {% elif not require_daytime %}
          true
        {% else %}
          {# Local time-of-day window check on the event's own timestamp. #}
          {% set event_local = t.astimezone() %}
          {% set event_min = event_local.hour * 60 + event_local.minute %}
          {% set start_h = (daytime_start.split(':')[0] | int) %}
          {% set start_m = (daytime_start.split(':')[1] | int) %}
          {% set end_h = (daytime_end.split(':')[0] | int) %}
          {% set end_m = (daytime_end.split(':')[1] | int) %}
          {% set start_min = start_h * 60 + start_m %}
          {% set end_min = end_h * 60 + end_m %}
          {{ start_min <= event_min <= end_min }}
        {% endif %}
      {% endif %}

action:
  - variables:
      event_time: "{{ as_datetime(states(time_entity)).astimezone() }}"
      event_height: "{{ states(height_entity) }}"
      event_unit: "{{ state_attr(height_entity, 'unit_of_measurement') }}"
      when_day: >-
        {% set ev = as_datetime(states(time_entity)).astimezone() %}
        {% set today = now().date() %}
        {% set diff = (ev.date() - today).days %}
        {% if diff == 0 %}today
        {% elif diff == 1 %}tomorrow
        {% else %}{{ ev.strftime('%A %b %-d') }}
        {% endif %}
  - service: !input notify_service
    data:
      title: !input notification_title
      message: >-
        Tide reaching {{ event_height }} {{ event_unit }}
        at {{ event_time.strftime('%-I:%M %p') }} {{ when_day | trim }}.
