blueprint:
  name: Tide extreme alert (crosses threshold)
  description: >
    Fires once a day at a chosen local time and notifies you when the
    next high or low tide within a lookahead window crosses a threshold.
    Great for planning ahead — "notify me at noon the day prior about
    tomorrow morning's ultra-low tide" so you can pack for a tidepool
    trip. Optional sun-aware daylight filter so overnight lows do not
    ping you.
  domain: automation
  source_url: https://raw.githubusercontent.com/mullender/ha-tides/main/blueprints/automation/ha_tides_plus/tide_extreme_alert.yaml
  input:
    station:
      name: Tide station
      description: >
        Pick the Tides Plus station device. The blueprint infers which
        Tides Plus sensor to watch from your "direction" choice below.
      selector:
        device:
          filter:
            - integration: ha_tides_plus
    threshold_direction:
      name: Direction
      description: >
        "Below" watches the next low tide (typical tidepool case);
        "above" watches the next high tide (dock height, king-high
        warning, storm surge, …).
      default: below
      selector:
        select:
          options:
            - value: below
              label: Notify when the next LOW is at or below the threshold
            - value: above
              label: Notify when the next HIGH is at or above the threshold
    threshold:
      name: Height threshold
      description: >
        Value is in the same unit as the Tides Plus sensor — feet on a
        US-defaults HA install, metres on a metric one. Check any tide
        sensor's current display to confirm.
      default: 1.0
      selector:
        number:
          min: -10
          max: 30
          step: 0.1
          mode: box
    notify_at:
      name: Notify at (local time of day)
      description: >
        The blueprint runs once each day at this time. Pick something
        that gives the lead time you want — noon the day prior, 8 PM
        the night before, 6 AM same-day, etc.
      default: "12:00:00"
      selector:
        time: {}
    lookahead_hours:
      name: Lookahead
      description: >
        How far into the future to look for a matching tide when the
        blueprint runs. 30 h covers "some time before tomorrow noon"
        when firing at noon; 48 h covers the next full cycle.
      default: 30
      selector:
        number:
          min: 1
          max: 96
          step: 1
          mode: slider
          unit_of_measurement: hr
    require_daylight:
      name: Only notify if the event happens in daylight
      description: >
        Uses sun.sun's next_rising / next_setting, projecting the local
        time-of-day onto the event's date. Accurate to a few minutes
        at ±1 day (sunrise drifts ~1 min/day).
      default: true
      selector:
        boolean: {}
    sun_entity:
      name: Sun entity
      default: sun.sun
      selector:
        entity:
          filter:
            domain: sun
    notify_service:
      name: Notification service
      description: >
        Notify service to call, for example
        notify.mobile_app_your_phone,
        notify.notify,
        notify.persistent_notification.
      default: notify.persistent_notification
      selector:
        text: {}
    notification_title:
      name: Notification title
      description: >
        Template-friendly. Available placeholders:
        {{ station_name }}, {{ event_height }}, {{ event_unit }},
        {{ event_time_local }} (a datetime — use .strftime('%-I:%M %p')),
        {{ when_day }} (today / tomorrow / weekday name).
      default: "Tide alert for {{ station_name }}"
      selector:
        text: {}
    notification_message:
      name: Notification message
      description: >
        Template-friendly. Same placeholders as the title.
      default: >-
        Tide reaching {{ event_height }} {{ event_unit }}
        at {{ event_time_local.strftime('%-I:%M %p') }} {{ when_day }}.
      selector:
        text:
          multiline: true

mode: single
max_exceeded: silent

variables:
  station_device: !input station
  thr_dir: !input threshold_direction
  thr: !input threshold
  lookahead_h: !input lookahead_hours
  require_daylight: !input require_daylight
  sun_entity: !input sun_entity
  # Sensor inference — Tides Plus entity IDs end with these suffixes
  # regardless of the device name.
  time_entity: >-
    {% set ents = device_entities(station_device) %}
    {% if thr_dir == 'below' %}
      {{ ents | select('search', '_next_low_tide$') | list | first | default('') }}
    {% else %}
      {{ ents | select('search', '_next_high_tide$') | list | first | default('') }}
    {% endif %}
  height_entity: >-
    {% set ents = device_entities(station_device) %}
    {% if thr_dir == 'below' %}
      {{ ents | select('search', '_next_low_tide_height$') | list | first | default('') }}
    {% else %}
      {{ ents | select('search', '_next_high_tide_height$') | list | first | default('') }}
    {% endif %}
  # Placeholders exposed to the user's title / message templates.
  station_name: "{{ device_attr(station_device, 'name') or 'tide station' }}"
  event_time_local: >-
    {% set ts = states(time_entity) %}
    {{ as_datetime(ts).astimezone() if ts not in ('unknown', 'unavailable', 'none', '', none) else none }}
  event_height: "{{ states(height_entity) }}"
  event_unit: "{{ state_attr(height_entity, 'unit_of_measurement') or '' }}"
  when_day: >-
    {% set ev = event_time_local %}
    {% if ev is none %}soon
    {% else %}
      {% set diff = (ev.date() - now().date()).days %}
      {% if diff == 0 %}today
      {% elif diff == 1 %}tomorrow
      {% else %}{{ ev.strftime('%A %b %-d') }}
      {% endif %}
    {% endif %}

trigger:
  - platform: time
    at: !input notify_at

condition:
  - condition: template
    value_template: >-
      {% if time_entity == '' or height_entity == '' %}
        false
      {% else %}
        {% set ts = states(time_entity) %}
        {% if ts in ('unknown', 'unavailable', 'none', '', None) %}
          false
        {% else %}
          {% set t = as_datetime(ts) %}
          {% set future = t > now() %}
          {% set within = (t - now()).total_seconds() < (lookahead_h | int) * 3600 %}
          {% set h = states(height_entity) | float(0) %}
          {% set meets = (h <= (thr | float)) if thr_dir == 'below' else (h >= (thr | float)) %}
          {% if not (future and within and meets) %}
            false
          {% elif not require_daylight %}
            true
          {% else %}
            {# Project the sun's time-of-day onto the event's date. HA's
               next_rising / next_setting are always the NEXT occurrence,
               so their HH:MM is the local sunrise / sunset for the current
               location; sunrise drifts ~1 min/day so applying today's
               time-of-day to tomorrow or the day after is accurate to a
               few minutes. #}
            {% set sr = as_datetime(state_attr(sun_entity, 'next_rising')) %}
            {% set ss = as_datetime(state_attr(sun_entity, 'next_setting')) %}
            {% if sr is none or ss is none %}
              true
            {% else %}
              {% set sr_local = sr.astimezone() %}
              {% set ss_local = ss.astimezone() %}
              {% set event_local = t.astimezone() %}
              {% set sr_min = sr_local.hour * 60 + sr_local.minute %}
              {% set ss_min = ss_local.hour * 60 + ss_local.minute %}
              {% set ev_min = event_local.hour * 60 + event_local.minute %}
              {{ sr_min <= ev_min <= ss_min }}
            {% endif %}
          {% endif %}
        {% endif %}
      {% endif %}

action:
  - service: !input notify_service
    data:
      title: !input notification_title
      message: !input notification_message
